# Redis kvscf-feed instance (kdeskdash) — rpidash3:6380
#
# The work desk's own kvscf endpoint: kwork publishes `kvscf:*` here and
# subscribes to `kvscf:focus:kwork`; rpidash3's Launcher and Remote modes read
# it over loopback. Deliberately a *second* instance, exactly as rpidash2 splits
# its claude feed from its control Redis (deploy/redis-claude.conf) — the
# control instance on 6379 stays loopback-only, so mode-control keys, last-mode
# persistence and the screenshot trigger are never reachable from the LAN.
#
# Unlike the claude feed, this one requires AUTH. rpidash3 is dual-homed (eth0 +
# tailscale0) and kwork cannot join the tailnet, so the LAN listener is
# mandatory and sits outside the tailnet ACLs that cover every other homelab
# hop. It also carries work Edge/VS Code window titles, which the fleet feed
# does not. kvscf gained publisher-side AUTH in its sprint 018
# (`KVSCF_REDIS_PASSWORD`); kdeskdash reads it via KDESKDASH_KVSCF_REDISCLI_AUTH.

port 6380
protected-mode yes

# Loopback only by default. The host-local include at the end of this file is
# what adds this device's LAN address — a later `bind` replaces the list, so the
# committed default is the safe one and the uncommitted file widens it.
bind 127.0.0.1 -::1

# Ephemeral feed, same posture as the claude instance: every kvscf key carries a
# 10s TTL and the launcher config is republished ~1×/sec, so there is nothing
# here worth persisting — and nothing worth restoring after a restart.
save ""
appendonly no

maxmemory 32mb
maxmemory-policy allkeys-lru

dir /var/lib/redis-kvscf
logfile ""
daemonize no

# Host-local settings: this device's LAN `bind` address and `requirepass`.
# Hand-installed (root:redis 0640), never committed — see
# docs/kwork-rpidash3-pairing.md. Redis **fails to start** when it is missing,
# which is the intended behaviour: this instance exists to be reached from
# another machine, so "came up without the local file" must never mean "came up
# LAN-bound and open". The failure is loud in `journalctl -u redis-kvscf`.
include /etc/redis/redis-kvscf-local.conf
