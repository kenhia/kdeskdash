# Redis kvscf-feed instance (kdeskdash) — rpidash2:6380
#
# ===========================================================================
# RETIRED IN PLACE — MARKED FOR REMOVAL WITH korg:2934
# ===========================================================================
# As of sprint 040 nothing reads or writes this instance. The dev pair's kvscf
# channel moved to central (rpi53:6379): cleo's deck publishes there and
# rpidash2's panel reads it there.
#
# It is left RUNNING on purpose. k-homelab's manifest still declares
# redis-claude.service, so stopping it here would have kmon's nightly report a
# declared service missing — a finding for a thing that was done deliberately.
# The k-homelab cleanup slice retires the unit, this conf, the package-store
# entry and the krot row in one change, which is the only order in which the
# audit never goes red. Do not delete this file ahead of it.
#
# rpidash3's equivalent (deploy/redis-kvscf.conf) is NOT retired: the kwork
# pair stays on its own server with its own password, and is now the fleet's
# only pair instance.
# ===========================================================================
#
# The unit and this file keep the name `redis-claude` because that is what the
# k-homelab manifest, the systemd unit and every runbook call it. The claude:*
# family it was created for (sprint 007) moved to the central Redis on rpi53 in
# sprint 031 and was deleted from here by kdashdata sprint 005; since then this
# instance serves `kvscf:*` ALONE. cleo's kvscf publishes the dev desk's
# window/launcher feed here and subscribes to `kvscf:focus:cleo`; rpidash2's
# Launcher and Remote modes read it over loopback. Deliberately a *second*
# instance so the control Redis on 6379 stays loopback-only and mode-control
# keys, last-mode persistence and the screenshot trigger never reach the LAN.
#
# Sprint 035 (korg WI 2216): this instance requires AUTH and no longer listens
# on the tailnet. It had been `bind 0.0.0.0` with no password since sprint 007
# ("trusted home LAN"), which kmon's nightly correctly reported as an
# unauthenticated Redis answering across the tailnet. The shape is now the one
# rpidash3's redis-kvscf.conf has had since sprint 026: loopback by default
# here, the LAN address and the `requirepass` in an uncommitted host-local
# include. kvscf presents the password from `KVSCF_REDIS_PASSWORD`
# (HKCU\Software\kenhia\kvscf on cleo, its sprint 018); kdeskdash from
# KDESKDASH_KVSCF_REDISCLI_AUTH in /etc/kdeskdash/secrets.env. Bring-up and
# the consumer list: deploy/hosts/README.md.

port 6380
protected-mode yes

# Loopback only by default. The host-local include at the end of this file is
# what adds this device's LAN address — a later `bind` replaces the list, so the
# committed default is the safe one and the uncommitted file widens it.
bind 127.0.0.1 -::1

# Ephemeral feed: every kvscf key carries a 10s TTL and the launcher config is
# republished ~1×/sec, so there is nothing worth persisting — or restoring.
save ""
appendonly no

maxmemory 32mb
maxmemory-policy allkeys-lru

dir /var/lib/redis-claude
logfile ""
daemonize no

# Host-local settings: this device's LAN `bind` address and `requirepass`.
# Hand-installed (root:redis 0640), never committed — see deploy/hosts/README.md.
# Redis **fails to start** when it is missing, which is the intended behaviour:
# this instance exists to be reached from cleo, so "came up without the local
# file" must never mean "came up LAN-bound and open". The failure is loud in
# `journalctl -u redis-claude`.
include /etc/redis/redis-claude-local.conf
